Motivo Uygulaması Gizlilik Politikası

Son güncelleme: 15 Kasım 2025

Motivo, kullanıcı gizliliğine önem verir. Bu politika, uygulamamızı kullanırken hangi verileri topladığımızı, nasıl kullandığımızı ve nasıl koruduğumuzu açıklar.

Toplanan Veriler

Motivo, kullanıcıdan herhangi bir kişisel veri (ad, e-posta, telefon numarası vb.) toplamaz.
Uygulama yalnızca motivasyon sözleri, süre sayacı ve bildirim özelliklerini yerel olarak cihazınızda çalıştırır.

Üçüncü Taraf Hizmetleri

Motivo, üçüncü taraf analiz, reklam veya kullanıcı takibi hizmetleri kullanmaz.
Eğer gelecekte bu tür servisler eklenirse, kullanıcıya açık bir bildirim yapılır.

Güvenlik

Tüm veriler cihazınızda saklanır; internet üzerinden üçüncü taraflara iletilmez.

